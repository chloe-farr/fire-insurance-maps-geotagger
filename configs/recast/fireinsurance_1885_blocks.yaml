# 1885 Victoria fire insurance book — full Index page, "BLOCK NUMBERS." table (two side-by-side pairs).
# Chandra header reads "BLOCK NUMBER. | STREET | BLOCK NUMBER. | STREET" but the second column holds sheet numbers.
# Reconstructed 2026-09-10.
# Known quirk: recast keeps Chandra's first table row, so the CSV starts with a stray header row (BLOCK NUMBER.,STREET,…).
# Drop it downstream (or edit the .md) — recast has no skip-first-row option yet.
name: fireinsurance_1885_blocks
description: 1885 index page block-number table (two column pairs per row)
filename_patterns:
  - "1885_Index"
match_priority: 50
table_index: 0              # table 1 on the same page is the streets index (see fireinsurance_1885_streets)
columns:
  - block_number
  - sheet
  - block_number_b
  - sheet_b
