# 1885 Victoria fire insurance book — "Index to streets" columns (Index_col1..col4 crops).
# Reconstructed 2026-09-10: the original fireinsurance_1885 config was lost from recast/configs.
# Chandra output: 3-col markdown table; first data row is sometimes a stray header ("INDEX" / "STREET STREET SHEET").
# Known quirk: recast keeps Chandra's first table row, so the CSV starts with a stray header row (STREET,STREET,SHEET / INDEX,,).
# Drop it downstream (or edit the .md) — recast has no skip-first-row option yet.
name: fireinsurance_1885_streets
description: 1885 index-to-streets column → one row per street segment
filename_patterns:
  - "1885_Index_col"
  - "Index_col"
match_priority: 10          # beat fireinsurance_1885_blocks, whose "1885_Index" pattern also matches
columns:
  - street
  - relative_position       # e.g. "W. of Douglas, N. Side"
  - sheet
expand_dittos: true         # " means same as the row above
